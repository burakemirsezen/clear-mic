name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix desktop
      - run: python scripts/fetch_rnnoise.py
      - run: python scripts/fetch_webrtc.py
      - run: scripts\build_webrtc.cmd
        shell: cmd
      - run: scripts\build_native.cmd
        shell: cmd
      - run: python scripts/fetch_vbcable.py
      - run: python scripts/verify_driver.py
      - run: scripts\build_device_setup.cmd
        shell: cmd
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py
      - name: Verify packaged processing
        run: python -c "import subprocess; subprocess.run(['dist/ClearMicAudio/ClearMicAudio.exe', '--self-test'], check=True, timeout=60)"
      - name: Verify packaged interface
        run: python scripts/verify_desktop.py
      - uses: actions/upload-artifact@v7
        with:
          name: ClearMic-windows-x64
          path: release/*.zip
